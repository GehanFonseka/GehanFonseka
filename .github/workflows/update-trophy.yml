
name: Update GitHub Trophies

on:
  push:
    paths:
      - "README.md"
      - ".github/workflows/update-trophy.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy.svg
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: GehanFonseka
          output_path: ./trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: onedark
          row: 2
          column: 4

      - name: Commit trophy.svg
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: "trophy.svg"
          commit_message: "chore: update GitHub trophies"
